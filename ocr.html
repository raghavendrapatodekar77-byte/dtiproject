<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>OCR Upload</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="styles.css">

</head>

<body class="bg-slate-900 text-white">

<div class="max-w-5xl mx-auto py-16">

<h1 class="text-4xl font-bold text-center mb-12">

📄 OCR Document Upload

</h1>

<div class="bg-slate-800 rounded-xl p-10">

<input
type="file"
class="w-full p-5 rounded bg-white text-black">

<button
class="mt-8 bg-orange-500 hover:bg-orange-600 px-8 py-3 rounded">

Extract Text

</button>

</div>

<div class="bg-slate-800 rounded-xl mt-10 p-8">

<h2 class="text-2xl mb-5">

OCR Output

</h2>

<textarea
rows="15"
class="w-full p-5 rounded text-black">

OCR extracted text will appear here...

</textarea>

</div>

</div>

</body>

</html>
